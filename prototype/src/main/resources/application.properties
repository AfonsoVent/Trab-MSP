spring.application.name=elderlyhealth
server.port=8080

# Timers dos BPMN (formato ISO-8601: PT20M = 20 minutos, PT1M = 1 minuto)
elderlyhealth.registo.timeout=PT20M
elderlyhealth.contacto.timeout-confirmacao=PT1M
elderlyhealth.queda.timeout-resposta=PT1M

# Verificacao periodica dos timers (ms)
elderlyhealth.scheduler.ativo=true
elderlyhealth.scheduler.intervalo-ms=5000

# Cria um idoso de demonstracao (id 1) ao arrancar
elderlyhealth.dados-demo=true
