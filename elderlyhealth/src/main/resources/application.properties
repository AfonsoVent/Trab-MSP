spring.application.name=elderlyhealth
server.port=8080

# Timers dos BPMN (formato ISO-8601: PT20M = 20 minutos, PT1M = 1 minuto)
elderlyhealth.registo.timeout=PT20M
elderlyhealth.contacto.timeout-confirmacao=PT1M
elderlyhealth.queda.timeout-resposta=PT1M

# Verificação periódica dos timers (ms)
elderlyhealth.scheduler.ativo=true
elderlyhealth.scheduler.intervalo-ms=5000

# Sessões (login) e chave dos sensores / tensiómetros (cabeçalho X-Device-Key)
elderlyhealth.sessao.duracao=PT8H
elderlyhealth.dispositivos.chave=dispositivo-demo-123

# Pasta onde ficam os documentos de cada idoso: storage/idosos/idoso-{NIF}/...
elderlyhealth.storage.dir=storage
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Contas e idosos de demonstração (ver DadosIniciais)
elderlyhealth.dados-demo=true
